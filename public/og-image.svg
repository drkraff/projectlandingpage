<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f0e8"/>
  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" stroke="#1a1a1a" stroke-width="1" fill="none"/>
  <!-- Brand name -->
  <text
    x="72"
    y="280"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="400"
    fill="#1a1a1a"
    letter-spacing="-3"
  >Acme</text>
  <!-- Tagline -->
  <text
    x="72"
    y="360"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#1a1a1a"
    opacity="0.5"
    letter-spacing="0"
  >The fastest way to build X</text>
  <!-- Accent line -->
  <rect x="72" y="420" width="80" height="2" fill="#E8450A"/>
  <!-- URL label -->
  <text
    x="72"
    y="570"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#1a1a1a"
    opacity="0.35"
    letter-spacing="0.5"
  >acme.com</text>
</svg>
